[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparrow-niche-finder"
version = "0.1.0"
description = "Deterministic response-rate comparisons from explicit local observations"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
snf = "sparrow_niche_finder.cli:main"

[tool.setuptools.packages.find]
include = ["sparrow_niche_finder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
